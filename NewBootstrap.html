<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Bootstrap Website</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="#">
                My Website
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="#">
                    Home
                </a>

                <a class="nav-link" href="#">
                    About
                </a>

                <a class="nav-link" href="#">
                    Contact
                </a>

            </div>

        </div>

    </nav>


    <!-- Hero Section -->

    <section class="bg-light text-center p-5">

        <div class="container">

            <h1>Welcome to My Website</h1>

            <p class="lead">
                My first website using Bootstrap.
            </p>

            <button class="btn btn-primary">
                Get Started
            </button>

        </div>

    </section>


    <!-- Cards -->

    <section class="container my-5">

        <h2 class="text-center mb-4">
            Our Services
        </h2>

        <div class="row">

            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            Web Design
                        </h5>

                        <p class="card-text">
                            We create beautiful websites.
                        </p>

                        <button class="btn btn-primary">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            Development
                        </h5>

                        <p class="card-text">
                            We build modern web applications.
                        </p>

                        <button class="btn btn-success">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            Support
                        </h5>

                        <p class="card-text">
                            We provide ongoing website support.
                        </p>

                        <button class="btn btn-warning">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
